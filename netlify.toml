# Publica só os dois HTML do app.
#
# Sem isso o Netlify serviria o repositório inteiro — as configs de servidor
# e a pasta de alternativas ficariam acessíveis pela URL do site. Não são
# segredo (o repositório é público), mas não têm por que estar lá.

[build]
  command = "mkdir -p dist && cp index.html p2p.html dist/"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "display-capture=(self)"

# O app muda com frequência; sem isso o navegador serve versão velha
# depois de cada deploy e o pessoal reclama de bug já corrigido.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
